","single_choice","metafisica","Evodio objeta: si la voluntad se dio para hacer el bien, no debería poder inclinarse al pecado. ¿Qué plantea Agustín antes de responder?"],["agustin-012","agustin","true_false_reasoned","teoria_conocimiento","Agustín y Evodio concluyen que, como creen en Dios por autoridad, ya no hace falta seguir investigando."],["agustin-x01","agustin","define_concept","vocabulario","Define el concepto de «pecado» en Agustín."],["agustin-x02","agustin","identify_author","contexto","Idea parafraseada: «Antes de poder conocer las verdades divinas hay que haber creído en ellas; pero una vez que se cree, hay que seguir buscando comprenderlas». ¿Qué autor la sostiene?"],["agustin-x03","agustin","match_pairs","vocabulario","Relaciona cada concepto con su significado en el texto de Agustín."],["agustin-x04","agustin","fill_blank","antropologia","Evodio razona que el hombre, en tanto que es hombre, es un ___, puesto que puede vivir rectamente cuando quiere."],["agustin-x05","agustin","true_false_reasoned","metafisica","Según el texto, la vida eterna consiste únicamente en creer en Jesucristo, sin necesidad de conocer a Dios."],["agustin-x06","agustin","single_choice","metafisica","Evodio deduce que pertenecemos a Dios porque nos hace bien y nos castiga. ¿Qué dos rasgos de Dios destaca con ello?"],["agustin-x07","agustin","order_steps","teoria_conocimiento","Ordena el razonamiento con el que Agustín justifica que hay que seguir investigando lo que ya se cree."],["agustin-x08","agustin","classify_statements","teoria_conocimiento","Clasifica estas afirmaciones sobre cómo conoce el alma la verdad: ¿son de Agustín o de Platón?"],["agustin-x09","agustin","define_concept","vocabulario","Define el concepto de «bien supremo» en Agustín."],["agustin-x10","agustin","single_choice","etica","Una alumna copia en un examen sabiendo que está mal y pudiendo no hacerlo. ¿Cómo describiría Agustín su acción?"],["agustin-x11","agustin","identify_author","politica","Idea parafra  ciudades de Agustín: ¿a cuál corresponde cada una?"],["agustin-t07","agustin","single_choice","antropologia","En las Confesiones, ¿dónde existen el pasado y el futuro según Agustín?"],["agustin-t08","agustin","true_false_reasoned","etica","Para el Agustín de madurez, tras el pecado original la voluntad humana no puede por sí sola elegir el bien sin la gracia de Dios."],["agustin-t09","agustin","fill_blank","vocabulario","Agustín resume la relación entre fe y razón con la fórmula latina «crede ut ___», es decir, «cree para comprender»."],["agustin-t10","agustin","identify_author","teoria_conocimiento","Fragmento parafraseado: «No salgas fuera, vuelve a ti mismo: en el interior del ser humano habita la verdad». ¿De qué autor es esta idea?"],["agustin-r01","agustin","identify_author","relaciones","Agustín defiende que hay que creer para comprender. ¿Qué autor subraya que la existencia de Dios es un «preámbulo de la fe» que la razón puede demostrar a partir de los efectos del mundo?"],["agustin-r02","agustin","fill_blank","relaciones","Agustín y Kant coinciden en que, sin ___, no tendría sentido atribuir mérito ni culpa moral a una persona."],["agustin-r03","agustin","true_false_reasoned","relaciones","Para Agustín, igual que para Platón, conocer consiste en recordar las Ideas que el alma contempló antes de nacer."],["agustin-r04","agustin","match_pairs","relaciones","Relaciona cada autor con la tesis que defiende en relación con Dios."],["agustin-r05","agustin","classify_statements","relaciones","Clasifica estas afirmaciones sobre el camino hacia la verdad: ¿son de Agustín o de Descartes?"],["agustin-r06","agustin","single_choice","relaciones","Agustín fundamenta la responsabilidad y la justicia del premio y del castigo en Dios. ¿Qué cuestiona Nietzsche de una moral así?"],["agustin-r07","agustin","true_false_reasoned","relaciones","Para Agustín, igual que para Aristóteles, obrar bien consiste sobre todo en adquirir el hábito de un justo medio guiado por la razón."],[ nclusión a la que llega."],["tomas-011","tomas","single_choice","metafisica","En la objeción 2 del artículo 1, se dice que Dios es lo más grande que se puede pensar y que, estando en el entendimiento, debe estar también en la realidad. ¿Cuál es la réplica de Tomás?"],["tomas-012","tomas","define_concept","metafisica","En la tercera vía, ¿qué significa que un ser sea «contingente» y por qué conduce a Dios?"],["tomas-x01","tomas","define_concept","vocabulario","Define el concepto de «primer motor» en Tomás."],["tomas-x02","tomas","fill_blank","metafisica","En la segunda vía, ninguna cosa puede ser su propia causa, porque entonces sería ___ a sí misma, y eso es imposible."],["tomas-x03","tomas","match_pairs","vocabulario","Relaciona cada concepto con su significado en las vías de Tomás."],["tomas-x04","tomas","identify_author","contexto","Idea parafraseada: «La fe presupone el conocimiento natural, como la gracia presupone la naturaleza y la perfección lo perfectible». ¿Qué autor la sostiene?"],["tomas-x05","tomas","true_false_reasoned","teoria_conocimiento","Para Tomás, podemos demostrar que Dios existe a partir de sus efectos, aunque no lleguemos a conocer exactamente cómo es Dios en sí mismo."],["tomas-x06","tomas","fill_blank","metafisica","Para ilustrar que mover es pasar de la potencia al acto, Tomás pone el ejemplo del fuego que calienta un ___."],["tomas-x07","tomas","order_steps","metafisica","Ordena el razonamiento de la segunda vía (la causa eficiente)."],["tomas-x08","tomas","classify_statements","teoria_conocimiento","Clasifica estas afirmaciones sobre causalidad y Dios: ¿son de Tomás o de Hume?"],["tomas-x09","tomas","true_false_reasoned","teoria_conocimiento","Si la existencia de Dios es demostrable, para Tomás ya no puede ser creída por fe por quien no entiende la demostración."],["tomas-x10","tomas","single_choice","teoria_conocimiento","Una objeción dice que no se puede demostrar a Dios por sus efectos, porque los efectos son finitos y Dios infinito. al fundamento de esa vía?"],["tomas-r09","tomas","classify_statements","relaciones","Clasifica cada afirmación según corresponda a Santo Tomás o a Kant. Parte de la ética se trabaja con doctrina general, no con el fragmento oficial."],["tomas-r10","tomas","single_choice","relaciones","En la cuarta vía Tomás cita a Aristóteles con el ejemplo del fuego, que tiene el máximo calor. ¿Qué principio ilustra?"],["descartes-001","descartes","single_choice","teoria_conocimiento","Al analizar su primera certeza («soy una cosa que piensa»), ¿qué regla general establece Descartes para reconocer la verdad?"],["descartes-002","descartes","fill_blank","metafisica","Para Descartes, Dios no puede ser engañador porque, según la luz natural, el engaño depende de algún ___."],["descartes-003","descartes","match_pairs","teoria_conocimiento","Relaciona cada término con su descripción según la Tercera Meditación."],["descartes-004","descartes","identify_author","contexto","Filósofo del siglo XVII que buscó un método seguro de conocimiento a partir de la duda, confió en las ideas claras y distintas y suele considerarse el padre de la filosofía moderna. ¿De quién se trata?"],["descartes-005","descartes","define_concept","teoria_conocimiento","Define el concepto de «luz natural» en Descartes."],["descartes-006","descartes","order_steps","metafisica","Ordena los pasos del argumento de Descartes para demostrar la existencia de Dios a partir de su idea."],["descartes-007","descartes","true_false_reasoned","teoria_conocimiento","Según Descartes, si imagino una quimera, ya me equivoco, porque la idea de una quimera es falsa en sí misma."],["descartes-008","descartes","single_choice","teoria_conocimiento","Con el ejemplo de las dos ideas del sol, ¿qué quiere mostrar Descartes?"],["descartes-009","descartes","match_pairs","teoria_conocimiento","Relaciona cada autor con su postura sobre el origen del conocimiento."],["descartes-010","descartes","define_concept","metafisica","Define el concepto de «realidad objetiva» de una idea en Descartes."],["descartes-011","descartes","classify_statements","teoria_conocimiento","Clasifica estas afirmaciones sobre el origen de las ideas: ¿son de Descartes, de Hume o de ambos?"],["descartes-012","descartes","single_choice","metafisica","¿Por qué sostiene Descartes que haber existido hace un momento no explica que yo exista ahora?"],["descartes-x01","descartes","define_concept","vocabulario","Define el concepto de «cosa pensante» (res cogitans) en Descartes."],["descartes-x02","descartes","single_choice","antropologia","¿Qué incluye Descartes dentro de «pensar» al describirse como cosa pensante?"],["descartes-x03","descartes","fill_blank","teoria_conocimiento","Descartes distingue ideas, voluntades o afecciones y juicios. Solo en los ___ puede haber error propiamente dicho."],["descartes-x04","descartes","identify_author","contexto","Pistas: clasifica las ideas en nacidas con la mente, venidas de fuera e inventadas por uno mismo. Para saber si algo existe fuera de él, examina cuánta realidad contiene cada idea. ¿De quién se trata?"],["descartes-x05","descartes","match_pairs","vocabulario","Relaciona cada concepto con su significado en la Tercera Meditación."],["descartes-x06","descartes","true_false_reasoned","teoria_conocimiento","Para Descartes, aunque un poder superior quisiera engañarme, no lograría que yo no sea nada mientras piense que soy algo."],["descartes-x07","descartes","single_choice","etica","¿Por qué no deben seguirse sin examen las inclinaciones naturales cuando se trata de distinguir lo verdadero de lo falso?"],["descartes-x08","descartes","order_steps","metafisica","Ordena el razonamiento con el que Descartes concluye que depende de un ser distinto de él."],["descartes-x09","descartes","classify_statements","antropologia","Clasifica estas afirmaciones de la Tercera Meditación: ¿describen al yo (cosa pensante) o a Dios (sustancia infinita)?"],["descartes-x10","descartes","define_concept","vocabulario","Define el concepto de «sustancia» tal como lo usa Descartes en la Tercera Meditación."],["descartes-x11","descartes","fill_blank","metafisica","Según Descartes, tiene en sí antes la noción de lo infinito que la de lo ___; es decir, antes la de Dios que la de sí mismo."],["descartes-x12","descartes","identify_author","politica","Pistas: duda de casi todo en el plano del conocimiento, pero en la vida práctica recomienda obedecer las leyes y costumbres del país y ser firme en las decisiones. ¿De qué autor se trata?"],["descartes-x13","descartes","single_choice","contexto","¿En qué consiste el llamado «círculo cartesiano», objeción que plantearon los críticos de Descartes?"],["descartes-x14","descartes","true_false_reasoned","metafisica","Descartes admite que la idea de Dios podría ser materialmente falsa, como la del frío o la del calor, y proceder de la nada."],["descartes-x15","descartes","match_pairs","etica","Relaciona cada concepto de la ética cartesiana con su significado."],["descartes-x16","descartes","order_steps","teoria_conocimiento","Ordena la crítica de Descartes a la creencia de que sus ideas sensibles se parecen a cosas exteriores."],["descartes-x17","descartes","classify_statements","contexto","Clasifica estas afirmaciones sobre el camino hacia la certeza: ¿son de Descartes, de Agustín o de ambos?"],["descartes-x18","descartes","single_choice","politica","Descartes duda radicalmente en el plano del conocimiento, pero es cauto ante las reformas políticas. ¿Cómo se concilian ambas actitudes?"],["descartes-r01","descartes","identify_author","relaciones","Fragmento parafraseado: «Toda idea está copiada de una impresión anterior; donde no hay impresión, no hay idea con significado». ¿Qué autor sostiene esta tesis, opuesta al innatismo de Descartes?"],["descartes-r02","descartes","fill_blank","relaciones","Descartes y Platón coinciden en que el conocimiento verdadero no se funda en los ___, aunque Platón lo explica con la reminiscencia y Descartes con las ideas innatas y la evidencia de la razón."],["descartes-r03","descartes","true_false_reasoned","relaciones","Descartes y Santo Tomás coinciden en que la existencia de Dios puede demostrarse con la razón, aunque cada uno parte de un punto distinto."],["descartes-r04","descartes","classify_statements","relaciones","Clasifica estas afirmaciones sobre cómo se llega a Dios: ¿son de Descartes o de Tomás?"],["descartes-r05","descartes","single_choice","relaciones","¿Qué diferencia principal hay entre el punto de partida de San Agustín y el de Descartes?"],["descartes-r06","descartes","match_pairs","relaciones","Une cada concepción del ser humano con el autor que la defiende."],["descartes-r07","descartes","single_choice","relaciones","Al comparar a Descartes con Rousseau en política, ¿qué contraste es correcto?"],["descartes-r08","descartes","classify_statements","relaciones","Clasifica estas afirmaciones sobre el origen y la certeza de las ideas: ¿son de Descartes o de Hume?"],["descartes-r09","descartes","single_choice","relaciones","Kant critica las pruebas racionales de la existencia de Dios, como la de Descartes. ¿Cuál es su objeción de fondo?"],["descartes-r10","descartes","true_false_reasoned","relaciones","Descartes y Hume discrepan sobre la causalidad: Descartes la apoya en la luz natural y Hume la explica por el hábito creado por la experiencia."],["hume-001","hume","single_choice","teoria_conocimiento","Al observar un caso particular de causa y efecto (por ejemplo, el movimiento de un cuerpo), ¿qué descubrimos según Hume?"],["hume-002","hume","define_concept","vocabulario","Define el concepto de «impresión» en Hume."],["hume-003","hume","true_false_reasoned","teoria_conocimiento","Según Hume, tras observar un solo caso en que un evento sigue a otro, ya podemos formular una regla general y predecir con seguridad lo que ocurrirá en casos parecidos."],["hume-004","hume","fill_blank","teoria_conocimiento","Según Hume, tras muchos casos similares, la mente espera que se repita el seguimiento habitual de un evento por el ___."],["hume-005","hume","order_steps","teoria_conocimiento","Ordena los pasos con los que Hume explica el origen de la idea de conexión necesaria."],["hume-006","hume","match_pairs","vocabulario","Relaciona cada término con su significado en el texto de Hume."],["hume-007","hume","identify_author","teoria_conocimiento","Fragmento parafraseado: «Nuestra idea de que una causa produce necesariamente su efecto no nace de ver ningún poder oculto, sino del hábito de la mente tras ver repetidos casos parecidos». ¿De qué autor es esta idea?"],["hume-008","hume","classify_statements","teoria_conocimiento","Clasifica estas afirmaciones sobre causalidad y certeza: ¿son de Descartes, de Hume o de ambos?"],["hume-009","hume","define_concept","teoria_conocimiento","¿Cómo define Hume el concepto de «causa»?"],["hume-010","hume","single_choice","teoria_conocimiento","Si no hay ninguna impresión de la que derive la idea de poder o conexión, ¿qué se sigue según el principio de copia de Hume?"],["hume-011","hume","single_choice","teoria_conocimiento","¿Dónde sitúa Hume la impresión de la que formamos la idea de conexión necesaria?"],["hume-012","hume","true_false_reasoned","teoria_conocimiento","Como Hume sostiene que no percibimos ninguna conexión necesaria, concluye que debemos dejar de usar la relación de causa y efecto en la ciencia y en la vida cotidiana."],["hume-x01","hume","define_concept","vocabulario","Define el concepto de «idea» en Hume."],["hume-x02","hume","single_choice","teoria_conocimiento","Con el ejemplo del choque de dos bolas de billar, ¿qué quiere mostrar Hume sobre la primera vez que alguien lo ve?"],["hume-x03","hume","fill_blank","teoria_conocimiento","Según Hume, la idea de conexión necesaria no surge de un caso único, sino de una ___ de casos similares."],["hume-x04","hume","identify_author","antropologia","Pistas: propone una «ciencia del hombre» con método experimental y, con cautela, plantea que no hay impresión de un yo permanente, sino un haz de percepciones. ¿De quién se trata?"],["hume-x05","hume","match_pairs","vocabulario","Relaciona cada término con su significado en Hume."],["hume-x06","hume","true_false_reasoned","teoria_conocimiento","Según Hume, al observar un caso concreto de causa y efecto en los cuerpos descubrimos la fuerza que une la causa con el efecto."],["hume-x07","hume","single_choice","antropologia","Al buscar la conexión en las operaciones de la mente sobre el cuerpo, ¿qué constata Hume?"],["hume-x08","hume","order_steps","teoria_conocimiento","Ordena el argumento de Hume sobre la relación causa-efecto y su definición."],["hume-x09","hume","classify_statements","vocabulario","Clasifica estas afirmaciones sobre la causa: ¿corresponden a la primera o a la segunda definición de Hume?"],["hume-x10","hume","define_concept","teoria_conocimiento","Define el concepto de «cuestiones de hecho» en Hume."],["hume-x11","hume","fill_blank","teoria_conocimiento","La conexión que sentimos en la mente es una transición rutinaria de la ___ desde un objeto a su normal seguimiento."],["hume-x12","hume","identify_author","politica","Pistas: niega que el gobierno naciera de un contrato original y sostiene que obedecemos por la costumbre y la utilidad de mantener la paz y la justicia. ¿De quién se trata?"],["hume-x13","hume","single_choice","etica","¿Qué advierte Hume en el pasaje conocido como «ley de Hume» o «falacia naturalista»?"],["hume-x14","hume","true_false_reasoned","teoria_conocimiento","Según Hume, la conexión necesaria está en los propios objetos, y la mente solo la descubre al observar muchos casos."],["hume-x15","hume","match_pairs","metafisica","Relaciona cada elemento de la crítica de Hume a la religión con su significado."],["hume-x16","hume","order_steps","metafisica","Ordena el razonamiento con el que la crítica de Hume a la causalidad afecta a la religión."],["hume-x17","hume","classify_statements","politica","Clasifica estas afirmaciones sobre el origen de la sociedad política: ¿son de Hume o de Rousseau?"],["hume-x18","hume","single_choice","antropologia","¿Por qué plantea Hume, con cautela, que la mente sería un haz de percepciones y no un yo permanente?"],["hume-r01","hume","identify_author","relaciones","Fragmento parafraseado: «Algunas ideas, como la de Dios o la de mí mismo, nacen con la mente y no proceden de los sentidos». ¿Qué autor sostiene esta tesis innatista, opuesta al principio de copia de Hume?"],["hume-r02","hume","fill_blank","relaciones","Para Hume la causa es una costumbre de la mente, mientras que ___ la entiende como un principio real de las cosas."],["hume-r03","hume","match_pairs","relaciones","Une cada tesis con el autor o la corriente que la sostiene en el problema del conocimiento."],["hume-r04","hume","classify_statements","relaciones","Clasifica estas afirmaciones sobre el fundamento de la moral: ¿son de Hume o de Kant?"],["hume-r05","hume","single_choice","relaciones","Frente a Rousseau, ¿cómo explica Hume el origen del gobierno y la obediencia política?"],["hume-r06","hume","true_false_reasoned","relaciones","Tomás de Aquino y Hume emplean la relación causa-efecto, así que ambos concluyen que la existencia de Dios puede demostrarse a partir de la experiencia."],["hume-r07","hume","order_steps","relaciones","Ordena el hilo que lleva del análisis humeano de la causalidad al replanteamiento de Kant."],["hume-r08","hume","classify_statements","relaciones","Clasifica estas afirmaciones sobre la causalidad: ¿son de Hume o de Aristóteles?"],["hume-r09","hume","single_choice","relaciones","¿Por qué choca la reminiscencia platónica con el principio de copia de Hume?"],["hume-r10","hume","fill_blank","relaciones","Descartes funda la certeza en la claridad y distinción y en la garantía de un Dios no engañador; para Hume, los razonamientos sobre cuestiones de hecho solo alcanzan un conocimiento ___."],["rousseau-001","rousseau","single_choice","politica","¿Cuál es, según Rousseau, el problema fundamental al que da solución el contrato social?"],["rousseau-002","rousseau","define_concept","politica","Define el concepto de «voluntad general» en Rousseau."],["rousseau-003","rousseau","match_pairs","vocabulario","Relaciona cada nombre con el sentido que le da Rousseau al cuerpo político o a sus miembros."],["rousseau-004","rousseau","fill_blank","politica","El pacto social busca que cada uno, uniéndose a todos, no obedezca sino a sí mismo y quede tan ___ como antes."],["rousseau-005","rousseau","order_steps","politica","Ordena los pasos del razonamiento con el que Rousseau llega al pacto social."],["rousseau-006","rousseau","true_false_reasoned","politica","Según Rousseau, para que el pacto funcione, cada asociado puede reservarse algunos derechos propios sin que cambie la naturaleza de la asociación."],["rousseau-007","rousseau","single_choice","politica","¿Por qué dice Rousseau que, al darse cada uno por entero, nadie tiene interés en hacer onerosa la condición para los demás?"],["rousseau-008","rousseau","define_concept","politica","Define el concepto de «soberano» en Rousseau."],["rousseau-009","rousseau","match_pairs","politica","Relaciona cada autor con su idea política característica."],["rousseau-010","rousseau","classify_statements","politica","Clasifica estas afirmaciones sobre la comunidad política: ¿son de Rousseau, de Aristóteles o de ambos?"],["rousseau-011","rousseau","single_choice","politica","Rousseau afirma que quien se niegue a obedecer la voluntad general será obligado a ello, lo que significa que se le obligará a ser libre. ¿Cómo se interpreta esta idea?"],["rousseau-012","rousseau","single_choice","politica","Según el capítulo VII, ¿por qué el soberano no necesita garantías frente a los súbditos, y en cambio los súbditos sí necesitan asegurar su fidelidad al soberano?"],["rousseau-x01","rousseau","define_concept","contexto","Define el concepto de «estado de naturaleza» tal como aparece en el fragmento de Rousseau."],["rousseau-x02","rousseau","define_concept","antropologia","Define el concepto de «voluntad particular» en Rousseau."],["rousseau-x03","rousseau","identify_author","politica","Idea parafraseada: «Un poder es legítimo cuando nace de un pacto en el que el pueblo, guiado por la voluntad general, hace las leyes a las que luego obedece». ¿A qué autor corresponde?"],["rousseau-x04","rousseau","match_pairs","vocabulario","Relaciona cada concepto con su significado en el fragmento."],["rousseau-x05","rousseau","fill_blank","antropologia","Cada individuo puede tener, como hombre, una voluntad ___ contraria a la voluntad general que tiene como ciudadano."],["rousseau-x06","rousseau","true_false_reasoned","contexto","Según Rousseau, los hombres salen del estado de naturaleza creando fuerzas nuevas que superen los obstáculos."],["rousseau-x07","rousseau","order_steps","etica","Ordena el argumento que lleva a Rousseau a la fórmula «obligado a ser libre»."],["rousseau-x08","rousseau","classify_statements","metafisica","Clasifica estas afirmaciones sobre religión y fundamento del poder: ¿son de Rousseau o de Tomás?"],["rousseau-x09","rousseau","single_choice","politica","Una persona participa con los demás en la aprobación de una ley y después la cumple como cualquier otro. ¿En qué condición actúa en cada momento, según Rousseau?"],["rousseau-x10","rousseau","true_false_reasoned","politica","Según Rousseau, si se viola el pacto social, cada cual recobra sus derechos primitivos y su libertad natural, y pierde la libertad convencional."],["rousseau-x11","rousseau","identify_author","teoria_conocimiento","Idea parafraseada: «El saber teórico, por sí solo, no basta para vivir bien; el sentimiento y la conciencia son guías internas de lo justo y de lo bueno». ¿Qué autor la sostiene?"],["rousseau-x12","rousseau","match_pairs","antropologia","Relaciona cada situación con el concepto de Rousseau que ilustra."],["rousseau-x13","rousseau","single_choice","politica","Rousseau dice que, dándose cada cual a todos, no se da a nadie. ¿Qué ventaja extrae de ello?"],["rousseau-x14","rousseau","single_choice","politica","Según el capítulo VII, ¿por qué el cuerpo político no puede, ni siquiera ante otro, enajenar una parte de sí mismo o someterse a otro soberano?"],["rousseau-x15","rousseau","true_false_reasoned","etica","La expresión «obligado a ser libre» significa que el Estado impone al individuo una voluntad completamente ajena a la suya."],["rousseau-x16","rousseau","order_steps","antropologia","Ordena el hilo del proyecto de Rousseau según su doctrina general."],["rousseau-x17","rousseau","classify_statements","etica","Clasifica estas afirmaciones sobre libertad y ley: ¿son de Rousseau o de Kant?"],["rousseau-x18","rousseau","fill_blank","etica","Según Rousseau, dándose cada ciudadano a la patria, queda asegurado de toda dependencia ___."],["rousseau-r01","rousseau","single_choice","relaciones","Kant se pregunta en la Crítica de la razón pura cuáles son las condiciones y los límites del conocimiento. ¿Qué distingue la preocupación central de Rousseau en el fragmento oficial?"],["rousseau-r02","rousseau","identify_author","relaciones","Un autor discute la idea del contrato como origen real del gobierno y explica la obediencia política por el hábito y por la utilidad que reporta la sociedad. ¿De qué autor se trata, que se opone así a Rousseau?"],["rousseau-r03","rousseau","fill_blank","relaciones","Rousseau y Marx denuncian que la sociedad desigual deforma al ser humano. Marx explica esa desigualdad por las relaciones de ___."],["rousseau-r04","rousseau","classify_statements","relaciones","Clasifica estas afirmaciones sobre el fundamento del poder político: ¿son de Rousseau o de Hume?"],["rousseau-r05","rousseau","true_false_reasoned","relaciones","Rousseau y Kant vinculan la libertad con la ley: ser libre es obedecer una ley que uno mismo se da."],["rousseau-r06","rousseau","match_pairs","relaciones","Une cada autor con su explicación del origen o la naturaleza de la sociedad política."],["rousseau-r07","rousseau","single_choice","relaciones","Tomás de Aquino sostiene que la razón puede demostrar la existencia de Dios. ¿Qué contraste ofrece Rousseau en el fragmento oficial y en su doctrina general?"],["rousseau-r08","rousseau","classify_statements","relaciones","Clasifica estas afirmaciones sobre la naturaleza humana y la desigualdad: ¿son de Rousseau o de Marx?"],["rousseau-r09","rousseau","single_choice","relaciones","Arendt valora la participación de los ciudadanos en la vida pública. ¿Qué matiz la separa de la idea rousseauniana de voluntad general?"],["rousseau-r10","rousseau","true_false_reasoned","relaciones","Igual que Aristóteles, Rousseau sostiene que la comunidad política surge de modo natural del impulso social del ser humano, y por eso no necesita ningún pacto."],["kant-001","kant","single_choice","teoria_conocimiento","¿Qué afirma Kant al comenzar la Introducción sobre la relación entre experiencia y conocimiento?"],["kant-002","kant","define_concept","vocabulario","Define el concepto de «conocimiento a priori» en Kant."],["kant-003","kant","define_concept","vocabulario","Define el concepto de «juicio sintético» según Kant."],["kant-004","kant","true_false_reasoned","teoria_conocimiento","Según Kant, la proposición «7 + 5 = 12» es un juicio analítico, porque el 12 ya está contenido en el concepto de la suma de 7 y 5."],["kant-005","kant","match_pairs","teoria_conocimiento","Relaciona cada ejemplo con el tipo de juicio que le corresponde en el texto."],["kant-006","kant","order_steps","teoria_conocimiento","Ordena el hilo del razonamiento de Kant en la Introducción."],["kant-007","kant","classify_statements","teoria_conocimiento","Clasifica estas afirmaciones sobre los límites de la razón: ¿corresponden al racionalismo dogmático, al empirismo de Hume o al criticismo de Kant?"],["kant-008","kant","identify_author","teoria_conocimiento","Fragmento parafraseado: «La idea de causa no expresa una necesidad objetiva: es solo la costumbre, nacida de ver que un hecho sigue a otro, de enlazar ciertas representaciones». ¿Qué autor sostiene esta tesis, según el propio texto de Kant?"],["kant-009","kant","single_choice","metafisica","Según el texto, ¿qué ciencia se ocupa de Dios, la libertad y la inmortalidad, y cómo procede al comenzar?"],["kant-010","kant","fill_blank","teoria_conocimiento","El problema general de la razón pura es: ¿cómo son posibles los juicios ___ a priori?"],["kant-011","kant","single_choice","teoria_conocimiento","¿Qué significa para Kant que un conocimiento sea «transcendental»?"],["kant-012","kant","classify_statements","teoria_conocimiento","Clasifica estas afirmaciones sobre la experiencia y la causalidad: ¿son de Hume, de Kant o de ambos?"],["kant-x01","kant","single_choice","vocabulario","¿Qué clase de universalidad pueden dar a sus juicios los conocimientos que proceden de la experiencia?"],["kant-x02","kant","fill_blank","teoria_conocimiento","Según Kant, la necesidad y la universalidad ___ son señales seguras de que un conocimiento es a priori."],["kant-x03","kant","identify_author","contexto","Fragmento parafraseado: «Antes de hacer metafísica hay que examinar las fuentes y los límites de la razón, y el problema propio de la razón pura es cómo son posibles los juicios sintéticos a priori». ¿Qué autor sostiene esta tesis?"],["kant-x04","kant","match_pairs","vocabulario","Une cada término con la descripción que le da Kant."],["kant-x05","kant","true_false_reasoned","teoria_conocimiento","Según Kant, los juicios de experiencia, como tales, son todos sintéticos."],["kant-x06","kant","order_steps","teoria_conocimiento","Ordena el razonamiento con el que Kant muestra que «7 + 5 = 12» no es un juicio analítico."],["kant-x07","kant","single_choice","teoria_conocimiento","Según Kant, ¿por qué «todo lo que sucede tiene una causa» no es un juicio analítico?"],["kant-x08","kant","define_concept","vocabulario","Define el concepto de «razón pura» según el texto de Kant."],["kant-x09","kant","classify_statements","teoria_conocimiento","Clasifica cada enunciado: ¿es un juicio analítico o un juicio sintético?"],["kant-x10","kant","fill_blank","metafisica","Kant dice que la utilidad de la crítica de la razón pura es sobre todo ___: no amplía el conocimiento, sino que depura la razón y la guarda de errores."],["kant-x11","kant","identify_author","etica","Fragmento parafraseado: «Una acción tiene valor moral cuando se hace por deber, por respeto a la ley, y no por inclinación o interés; la ley moral obliga sin condiciones». ¿Qué autor sostiene esta tesis?"],["kant-x12","kant","true_false_reasoned","teoria_conocimiento","Según Kant, la proposición «todo cambio tiene su causa» es a priori y, además, pura."],["kant-x13","kant","order_steps","metafisica","Ordena el recorrido que, según Kant, lleva de la matemática a la necesidad de una crítica de la razón."],["kant-x14","kant","single_choice","antropologia","Kant dice que la metafísica es real, al menos como «disposición natural». ¿Cómo lo justifica?"],["kant-x15","kant","match_pairs","etica","Une cada concepto de la ética kantiana con su descripción."],["kant-x16","kant","define_concept","metafisica","Define el concepto de «postulado de la razón práctica» en la filosofía de Kant, por ejemplo respecto a Dios."],["kant-x17","kant","classify_statements","metafisica","Clasifica estas afirmaciones sobre razón y experiencia: ¿son de Platón o de Kant?"],["kant-x18","kant","single_choice","politica","¿Qué entiende Kant por «Ilustración»?"],["kant-r01","kant","single_choice","relaciones","Kant y Hume parten del mismo punto en el problema del conocimiento. ¿Cuál es?"],["kant-r02","kant","fill_blank","relaciones","Frente al uso dogmático de la razón, que confía en ella sin examinarla antes, Kant propone una ___ de la razón pura."],["kant-r03","kant","match_pairs","relaciones","Une cada idea con el autor al que se asocia en el contraste que plantea Kant."],["kant-r04","kant","true_false_reasoned","etica","Tanto Aristóteles como Kant sostienen que lo que da valor moral a una acción es su capacidad de llevar a la felicidad."],["kant-r05","kant","classify_statements","relaciones","Clasifica estas afirmaciones sobre la demostración de Dios: ¿son de Tomás o de Kant?"],["kant-r06","kant","single_choice","relaciones","¿En qué se diferencian Rousseau y Kant al entender el contrato social?"],["kant-r07","kant","order_steps","relaciones","Ordena el desarrollo del contraste entre Hume y Kant sobre la causalidad."],["kant-r08","kant","single_choice","relaciones","Con la imagen de la paloma, Kant se refiere a Platón. ¿Qué reproche le dirige?"],["kant-r09","kant","true_false_reasoned","relaciones","Kant critica el racionalismo de Descartes sin negar el conocimiento a priori: lo que reprocha es usar la razón sin examinar antes sus límites."],["kant-r10","kant","classify_statements","relaciones","Clasifica estas afirmaciones sobre los límites de la razón: ¿son de Descartes o de Kant?"],["marx-001","marx","single_choice","contexto","Según Marx, ¿cuál es la primera premisa de toda existencia humana y de toda historia?"],["marx-002","marx","define_concept","vocabulario","Define el concepto de «ideología» tal como se desprende del texto de Marx."],["marx-003","marx","true_false_reasoned","antropologia","Según Marx, la producción de los medios de vida, la creación de nuevas necesidades y la procreación (familia) son tres fases históricas sucesivas, de modo que cada una deja de existir cuando aparece la siguiente."],["marx-004","marx","define_concept","vocabulario","Define el concepto de «división del trabajo» en este texto de Marx."],["marx-005","marx","classify_statements","metafisica","Clasifica estas afirmaciones sobre cómo se explica la historia: ¿idealismo criticado por Marx o materialismo histórico?"],["marx-006","marx","order_steps","contexto","Ordena el hilo del razonamiento de Marx en el texto."],["marx-007","marx","single_choice","politica","Según Marx, ¿qué es el Estado y qu ica Marx a los historiadores alemanes en el fragmento?"],["marx-x08","marx","match_pairs","teoria_conocimiento","Relaciona cada forma de conciencia con la descripción que Marx hace de ella."],["marx-x09","marx","fill_blank","teoria_conocimiento","Marx afirma que el lenguaje es la conciencia ___, la conciencia real, que existe también para los demás y, por eso, para mí mismo."],["marx-x10","marx","order_steps","politica","Ordena el razonamiento de Marx sobre el origen del Estado."],["marx-x11","marx","identify_author","politica","Un autor afirma que la propiedad tiene su primer germen en la familia, donde la mujer y los hijos son esclavos del marido, y la define como el derecho a disponer de la fuerza de trabajo ajena. ¿Quién es?"],["marx-x12","marx","true_false_reasoned","politica","Según Marx, toda clase que aspire a dominar tiene que conquistar antes el poder político, salvo el proletariado, que puede abolir las clases sin pasar por él."],["marx-x13","marx","match_pairs","vocabulario","Relaciona cada concepto con la descripción que le corresponde en el pensamiento de Marx."],["marx-x14","marx","classify_statements","metafisica","Clasifica estas afirmaciones sobre religión y Dios: ¿son de Marx o de Tomás?"],["marx-x15","marx","single_choice","politica","Según Marx, ¿qué ocurriría si se intentara el comunismo sin un gran desarrollo de las fuerzas productivas?"],["marx-x16","marx","define_concept","contexto","Define el «materialismo histórico» tal como se desprende de la lectura de Marx."],["marx-x17","marx","order_steps","politica","Ordena el razonamiento de Marx sobre cómo acabar con la enajenación."],["marx-x18","marx","true_false_reasoned","etica","Como Marx considera la moral «pura» una forma de ideología, su pensamiento carece por completo de contenido valorativo y no denuncia nada como un mal."],["marx-r01","marx","single_choice","relaciones","¿Cómo se diferencian Platón y Marx a la hora de explicar de dónde vienen las ideas?"],["marx-r02","marx","identify_author","relaciones","Un autor sostiene que un Estado legítimo nace de un pacto en el que el pueblo soberano, por la voluntad general, se obedece a sí mismo. Marx desconfía de esa imagen y ve en el Estado una «comunidad ilusoria». ¿A qué autor corresponde la tes"],["marx-r03","marx","fill_blank","relaciones","Aristóteles define al ser humano como animal racional y ___; Marx subraya, además, que se hace históricamente produciendo sus medios de vida."],["marx-r04","marx","classify_statements","relaciones","Clasifica estas afirmaciones sobre la moral: ¿son de Marx o de Kant?"],["marx-r05","marx","match_pairs","relaciones","Relaciona cada tesis con la concepción a la que corresponde."],["marx-r06","marx","true_false_reasoned","relaciones","Marx y Nietzsche explican la crítica de la religión del mismo modo: ambos la atribuyen sobre todo a las condiciones económicas de producción."],["marx-r07","marx","single_choice","relaciones","Marx y Hume parten de lo real y de la experiencia, y desconfían de las ideas abstractas. ¿Qué distingue a Marx cuando quiere explicar la sociedad?"],["marx-r08","marx","order_steps","relaciones","Ordena cómo puede razonar Marx frente a una moral «pura» como la kantiana."],["marx-r09","marx","classify_statements","relaciones","Clasifica estas afirmaciones sobre lo propiamente humano: ¿son de Marx o de Arendt?"],["marx-r10","marx","single_choice","relaciones","¿Cuál es el contraste correcto entre Aristóteles y Marx sobre la comunidad política?"],["nietzsche-001","nietzsche","single_choice","contexto","¿Qué quiere decir Nietzsche en el § 343 con que «Dios ha muerto»?"],["nietzsche-002","nietzsche","define_concept","vocabulario","Define el concepto de «muerte de Dios» en Nietzsche."],["nietzsche-003","nietzsche","single_choice","etica","¿Cómo reaccionan ante la muerte de Dios los «espíritus libres» según el § 343?"],["nietzsche-004","nietzsche","define_concept","vocabulario","Define el concepto de «nihilismo» tal como lo plantea Nietzsche en el § 346."],["nietzsche-005","nietzsche","true_false_reasoned","teoria_conocimiento","Según el § 344, la ciencia moderna no descansa en ninguna creencia: es un saber sin supuestos que ha dejado atrás la metafísica y la religión."],["nietzsche-006","nietzsche","classify_statements","etica","Clasifica estas afirmaciones sobre Dios, la verdad y la moral: ¿pertenecen a la tradición criticada o a la posición de Nietzsche?"],["nietzsche-007","nietzsche","order_steps","contexto","Ordena el hilo del razonamiento de Nietzsche en los cuatro parágrafos."],["nietzsche-008","nietzsche","identify_author","teoria_conocimiento","En el § 344, ¿a qué filósofo menciona Nietzsche como partícipe de la creencia milenaria de que Dios es la verdad y la verdad es divina?"],["nietzsche-009","nietzsche","fill_blank","teoria_conocimiento","Según Nietzsche, la «voluntad de verdad» podría ocultar una voluntad de ___."],["nietzsche-010","nietzsche","single_choice","etica","¿Qué reproche hace Nietzsche en el § 345 a los historiadores de la moral, sobre todo ingleses?"],["nietzsche-011","nietzsche","single_choice","antropologia","¿Qué dice Nietzsche del ser humano y del mundo en el § 346?"],["nietzsche-012","nietzsche","match_pairs","etica","Relaciona cada postura o corriente con lo que Nietzsche le atribuye en estos parágrafos."],["nietzsche-x01","nietzsche","define_concept","vocabulario","Define el concepto de «creencia metafísica» tal como aparece en el § 344."],["nietzsche-x02","nietzsche","fill_blank","antropologia","Según el § 346, el hombre es un animal que ___."],["nietzsche-x03","nietzsche","identify_author","antropologia","Fragmento parafraseado: «El hombre es un animal que necesita venerar y que, por eso, interpretó el mundo como divino durante mucho tiempo». ¿Qué autor lo sostiene?"],["nietzsche-x04","nietzsche","true_false_reasoned","contexto","Según el § 343, la inmensa mayoría de los europeos ya ha comprendido todo lo que se derrumbará con la muerte de Dios."],["nietzsche-x05","nietzsche","match_pairs","vocabulario","Relaciona cada parágrafo del Libro V con su tema principal."],["nietzsche-x06","nietzsche","define_concept","vocabulario","Define la distinción entre «valor» y «origen» de una moral, según el § 345."],["nietzsche-x07","nietzsche","fill_blank","teoria_conocimiento","Cuando Nietzsche concluye que la voluntad de verdad significa «no quiero engañar ni engañarme», dice que así estamos en el terreno de la ___."],["nietzsche-x08","nietzsche","order_steps","teoria_conocimiento","Ordena el razonamiento del § 344 sobre el fundamento de la ciencia."],["nietzsche-x09","nietzsche","order_steps","contexto","Ordena las consecuencias de la muerte de Dios tal como se van planteando en el fragmento."],["nietzsche-x10","nietzsche","true_false_reasoned","etica","Según el § 345, si se demuestra que una moral nació de un error, queda demostrado que carece de valor."],["nietzsche-x11","nietzsche","true_false_reasoned","antropologia","En el § 346 Nietzsche propone que el ser humano ponga la vida en la balanza y la juzgue desde fuera, pues así supera el pesimismo."],["nietzsche-x12","nietzsche","classify_statements","etica","Clasifica estas afirmaciones sobre la moral: ¿son de Marx o de Nietzsche?"],["nietzsche-x13","nietzsche","classify_statements","antropologia","Clasifica estas afirmaciones sobre el ser humano y su libertad: ¿son de Rousseau o de Nietzsche?"],["nietzsche-x14","nietzsche","classify_statements","metafisica","Clasifica estas afirmaciones sobre la creencia en Dios: ¿son de Tomás o de Nietzsche?"],["nietzsche-x15","nietzsche","match_pairs","vocabulario","Relaciona cada concepto con la idea que le corresponde en el texto."],["nietzsche-x16","nietzsche","single_choice","antropologia","¿Por qué dice Nietzsche en el § 345 que los grandes problemas exigen personalidades fuertes?"],["nietzsche-x17","nietzsche","single_choice","politica","¿Qué puede afirmarse con rigor sobre la política de Nietzsche a partir del fragmento oficial?"],["nietzsche-x18","nietzsche","identify_author","etica","Fragmento parafraseado: «Nadie ha examinado todavía el valor de la más famosa de las medicinas, llamada moral». ¿A qué autor corresponde?"],["nietzsche-r01","nietzsche","identify_author","relaciones","Nietzsche constata en el § 343 que la fe en el Dios cristiano ha perdido crédito en Europa. ¿Qué autor, en cambio, ofrece cinco vías para demostrar racionalmente que Dios existe?"],["nietzsche-r02","nietzsche","fill_blank","relaciones","Frente a Kant, que fundamenta la moral en el deber de la razón práctica, Nietzsche propone preguntar por el ___ de la moral."],["nietzsche-r03","nietzsche","match_pairs","relaciones","Une cada tesis con el autor al que se asocia en la comparación con Nietzsche."],["nietzsche-r04","nietzsche","classify_statements","relaciones","Clasifica cada afirmación según corresponda a Kant o a Nietzsche en la cuestión de la moral."],["nietzsche-r05","nietzsche","single_choice","relaciones","Marx y Nietzsche sospechan de la moral tradicional. ¿Qué diferencia hay entre ambos en la forma de abordarla?"],["nietzsche-r06","nietzsche","true_false_reasoned","relaciones","Nietzsche sostiene en el § 344 que la fe de la ciencia en la verdad no tiene ninguna relación con la tradición de Platón."],["nietzsche-r07","nietzsche","identify_author","relaciones","Fragmento parafraseado: «La perspectiva no deforma la realidad, la organiza; la verdad completa se obtiene sumando las perspectivas de todos». ¿Qué autor, contrapunto de Nietzsche en el conocimiento, sostiene esto?"],["nietzsche-r08","nietzsche","classify_statements","relaciones","Clasifica cada afirmación según corresponda a Nietzsche o a Ortega."],["nietzsche-r09","nietzsche","single_choice","relaciones","Descartes busca una certeza firme apoyada en la evidencia racional. ¿Qué cuestiona Nietzsche en el § 344 que afecta a ese tipo de proyecto?"],["nietzsche-r10","nietzsche","true_false_reasoned","relaciones","Igual que Rousseau, Nietzsche presenta al ser humano en el § 346 com   else if(t.getAttribute&&t.getAttribute('data-pick')){var id=t.getAttribute('data-pick'),i=rb.sel.indexOf(id);if(t.checked&&i<0)rb.sel.push(id);if(!t.checked&&i>=0)rb.sel.splice(i,1);draw();}

  else if(t.id==='rest'){t.files[0].text().then(function(tx){var s=JSON.parse(tx);if(!s||!s.box||!s.salt)throw 0;localStorage.setItem(LS,JSON.stringify(s));KEY=null;DB=null;msg='Copia restaurada. Entra con la contraseña que tenía esa copia.';draw();},function(){note('El archivo no es una copia válida.',true);});}
  else if(t.getAttribute&&t.getAttribute('data-in')){rb[t.getAttribute('data-in')]=t.value;var mb=$('[data-act="mk"]');if(mb)mb.disabled=!(rb.sel.length&&rb.t.trim());}
});
document.addEventListener('input',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-in')&&(t.getAttribute('data-in')==='t'||t.getAttribute('data-in')==='txt')){rb[t.getAttribute('data-in')]=t.value;if(t.getAttribute('data-in')==='txt'){clearTimeout(draw.t);draw.t=setTimeout(draw,250);}else{var b=$('[data-act="mk"]');if(b)b.disabled=!(rb.sel.length&&rb.t.trim());}}});
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),D=function(k){return el.getAttribute('data-'+k);};
  if(a==='v'){view=D('v');sel=null;retoSel=null;msg='';logLines=null;draw();}
  else if(a==='lock')lock();
  else if(a==='sort'){var k=D('k');if(sortK===k)sortD=-sortD;else{sortK=k;sortD=(k==='nombre')?1:-1;}draw();}
  else if(a==='stu'){sel=D('k');msg='';draw();window.scrollTo(0,0);}
  else if(a==='back'){sel=null;draw();}
  else if(a==='del'){if(confirm('¿Eliminar a este alumno y sus informes de este panel?')){delete DB.students[D('k')];sel=null;persist();draw();}}
  else if(a==='csv'){var L=students(),hd=['Alumno','Grupo','Último informe','XP','Acierto %','Dominio medio %','Días activos 7d'].concat(AORD.map(function(x){return AN[x];}));var rows=[hd].concat(L.map(function(o){var r=last(o.s),m=meta(r);return [o.s.name,o.s.g,r.d.slice(0,10),r.xp,m.acc==null?'':m.acc,m.dom,m.act].concat(AORD.map(function(x){var z=r.a.filter(function(q){return q[0]===x;})[0];return z&&z[2]>0?z[1]:'';}));}));dl('clase-filosofia.csv','﻿'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\n'),'text/csv');}
  else if(a==='imp'){var tx=$('#imp').value;ingest(tx).then(function(l){logLines=l;draw();});}
  else if(a==='rand'){var pool=BANK.filter(function(q){return (rb.au==='*'||q[1]===rb.au)&&(!rb.txt||q[4].toLowerCase().indexOf(rb.txt.toLowerCase())>=0)&&rb.sel.indexOf(q[0])<0;});for(var i=0;i<10&&pool.length;i++){var j=Math.floor(Math.random()*pool.length);rb.sel.push(pool.splice(j,1)[0][0]);}draw();}
  else if(a==='rbclr'){rb.sel=[];draw();}
  else if(a==='mk'){var o={v:1,i:rid(),t:rb.t.trim().slice(0,80),q:rb.sel.slice(0,60),tl:+rb.tl||0,x:rb.x||'',d:new Date().toISOString()};PC.enc('R',o).then(function(c){DB.retos[o.i]={i:o.i,t:o.t,q:o.q,tl:o.tl,x:o.x,created:o.d,code:c,res:{}};persist();rb={t:'',tl:'',x:'',sel:[],au:rb.au,txt:''};retoSel=o.i;draw();});}
  else if(a==='reto'){retoSel=D('i');draw();window.scrollTo(0,0);}
  else if(a==='rback'){retoSel=null;draw();}
  else if(a==='rdel'){if(confirm('¿Eliminar este reto y sus resultados?')){delete DB.retos[D('i')];retoSel=null;persist();draw();}}
  else if(a==='cpy'){var cd=DB.retos[D('i')].code;(navigator.clipboard?navigator.clipboard.writeText(cd):Promise.reject()).then(function(){note('Código copiado.');},function(){var ta=$('textarea.code');if(ta){ta.select();document.execCommand('copy');note('Código copiado.');}});}
  else if(a==='svf'){dl('reto-'+DB.retos[D('i')].t.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.txt',DB.retos[D('i')].code);}
  else if(a==='errreto'){var agg={};students().forEach(function(o){(last(o.s).q||[]).forEach(function(q){var z=agg[q[0]]||(agg[q[0]]={n:0,ko:0});z.n++;z.ko+=q[2];});});rb.sel=Object.keys(agg).sort(function(x,y){return agg[y].n-agg[x].n||agg[y].ko-agg[x].ko;}).slice(0,10);rb.t=rb.t||'Repaso de los errores de la clase';view='retos';retoSel=null;draw();}
  else if(a==='bak'){dl('copia-panel-filosofia.json',localStorage.getItem(LS)||'{}','application/json');}
  else if(a==='chpw'){var p1=$('#pw1').value,er=setPw(p1,$('#pw2').value);if(er){note(er,true);return;}SALT=crypto.getRandomValues(new Uint8Array(16));derive(p1,SALT,IT).then(function(k){KEY=k;persist();note('Contraseña cambiada.');});}
  else if(a==='wipe'){if(confirm('Se borrarán TODOS los datos de este panel. ¿Continuar?')){DB={v:1,students:{},retos:{}};persist();note('Datos borrados.');}}
});
draw();
})();
</script></body></html>
